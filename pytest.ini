[pytest]
minversion = 7.0
addopts = -ra --strict-markers
pythonpath = .
testpaths =
    tests
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
asyncio_mode = auto
markers =
    unit: Hermetic unit and component tests with zero network dependencies (Tier 1)
    integration: Live API client integrations and multi-agent DAG orchestration tests (Tier 2 & Tier 3)
    e2e: End-to-end and remote cloud endpoint verification tests (Tier 4)
    adversarial: Prompt injection, ABAC perimeter escalation, and concurrency race tests (Tier 5)
